		9A1B2C3D4E5F60718293A4B5 /* Copy BreakpointJIT (unlinked) */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
			);
			name = "Copy BreakpointJIT (unlinked)";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# BreakpointJIT.framework is deliberately NOT linked or code-signed here.\n# It is dlopen()'d lazily at runtime (see src/core/ios/ios_jit_allocator.cpp)\n# so it never appears in the main binary's LC_LOAD_DYLIB list, which would\n# otherwise make dyld auto-load it at launch and trip AMFI's \"entitlements on\n# a non-main binary\" check on sideloaded/free-provisioning builds.\nmkdir -p \"$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH\"\ncp -R \"$SRCROOT/Frameworks/BreakpointJIT.framework\" \"$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH/\"\n\n# libvulkan.dylib (MoltenVK) -- same reasoning: not linked, so it never appears\n# in LC_LOAD_DYLIB. SDL's UIKit Vulkan backend dlopen()s it by this exact name\n# at runtime (see src/sdl_window.cpp's SDL_HINT_VULKAN_LIBRARY hint). KosmicKrisp,\n# this project's usual Vulkan-over-Metal driver on Apple platforms, has no iOS\n# build yet, so MoltenVK stands in for it here.\ncp \"$SRCROOT/Frameworks/libvulkan.dylib\" \"$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH/\"\n";
		};
/* End PBXShellScriptBuildPhase section */

